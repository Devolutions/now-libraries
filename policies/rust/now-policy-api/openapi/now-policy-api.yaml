openapi: 3.1.0
info:
  title: Devolutions NOW Package Broker API
  description: HTTP API exposed by a Devolutions NOW package broker facade over a Windows named pipe.
  version: '1.0'
paths:
  /v1/health:
    get:
      summary: Health check
      description: Returns broker readiness state.
      responses:
        '200':
          description: Response body for `GET /v1/health`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/capabilities:
    get:
      summary: Get capabilities
      description: Returns transports, managers, and operations supported by the broker.
      responses:
        '200':
          description: Response body for `GET /v1/capabilities`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/policy:
    get:
      summary: Get active policy
      description: Returns the active parsed policy document. A 404 response means no active policy is configured.
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Response body for `GET /v1/policy`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Replace the configured policy
      description: Reparses and revalidates the raw draft inside the write transaction, then atomically commits it only when the expected opaque store token and validation receipt still match. The complete HTTP request body, including the envelope, is limited to 16 MiB (16,777,216 bytes). This operational transport cap is below the schema's theoretical maximum.
      requestBody:
        description: Request body for `PUT /v1/policy`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyReplacementRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyReplacementResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-max-request-body-bytes: 16777216
  /v1/policy/management:
    get:
      summary: Get policy management state
      description: Atomically returns configured policy state and advisory write capability. Capability fields are UX guidance and are rechecked during replacement.
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Response body for `GET /v1/policy/management`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyManagementResponse'
  /v1/policy/validate:
    post:
      summary: Validate a policy draft
      description: Authoritatively validates raw draft JSON without discarding unknown fields. Validation findings are returned with HTTP 200; malformed envelopes use ErrorResponse. The complete HTTP request body, including the envelope, is limited to 16 MiB (16,777,216 bytes). This operational transport cap is below the schema's theoretical maximum.
      requestBody:
        description: Request body for `POST /v1/policy/validate`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyValidationRequest'
        required: true
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Response body for `POST /v1/policy/validate`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyValidationResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-max-request-body-bytes: 16777216
  /v1/package-operations/evaluate:
    post:
      summary: Evaluate package operation
      description: Evaluates a package operation against policy without requiring elevated execution.
      requestBody:
        description: Canonical request sent by a package broker client to the elevated broker.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRequest'
        required: true
      responses:
        '200':
          description: Canonical response returned by the broker after evaluating a request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/package-operations/execute:
    post:
      summary: Execute package operation
      description: Evaluates a package operation and submits it to the implementation for execution when allowed.
      requestBody:
        description: Canonical request sent by a package broker client to the elevated broker.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRequest'
        required: true
      responses:
        '200':
          description: Response returned after an execute request is evaluated and, when allowed, submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/package-operations/get-status:
    post:
      summary: Query package operation status
      description: Returns the current status of a previously submitted package operation.
      requestBody:
        description: Request body for querying an operation status.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
        required: true
      responses:
        '200':
          description: Response to a status query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/package-operations/cancel:
    post:
      summary: Cancel package operation
      description: 'Requests cancelation of a previously submitted package operation. Cancelation is asynchronous: poll the status endpoint until the operation reaches a terminal status.'
      requestBody:
        description: Request body for canceling a previously submitted operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
        required: true
      responses:
        '200':
          description: |-
            Response to a cancel request.

             Cancelation is asynchronous and idempotent: the broker acknowledges the request by
             moving a non-terminal operation to `Canceling` and reports the resulting status.
             Clients should poll the status endpoint until the operation reaches a terminal
             status (`Canceled`, or `Completed`/`Failed` when the process ends first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ApiVersion:
      description: HTTP API version string.
      type: string
      pattern: ^[0-9]+\.[0-9]+$
    Architecture:
      description: Target architecture.
      type: string
      enum:
      - X86
      - X64
      - Arm64
      - Neutral
    CancelRequest:
      description: Request body for canceling a previously submitted operation.
      type: object
      properties:
        Client:
          description: Client context used to authenticate the cancel request.
          allOf:
          - $ref: '#/components/schemas/ClientContext'
        OperationId:
          description: Server-issued stable operation identifier.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        RequestKind:
          description: Request discriminator.
          allOf:
          - $ref: '#/components/schemas/CancelRequestKind'
        RequestVersion:
          description: Client-side API version used to construct the request.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
      additionalProperties: false
      required:
      - RequestKind
      - RequestVersion
      - OperationId
      - Client
    CancelRequestKind:
      type: string
      pattern: ^CancelRequest$
    CancelResponse:
      description: |-
        Response to a cancel request.

         Cancelation is asynchronous and idempotent: the broker acknowledges the request by
         moving a non-terminal operation to `Canceling` and reports the resulting status.
         Clients should poll the status endpoint until the operation reaches a terminal
         status (`Canceled`, or `Completed`/`Failed` when the process ends first).
      type: object
      properties:
        Message:
          description: Human-readable message about the cancelation outcome.
          type: string
          maxLength: 2048
          nullable: true
        OperationId:
          description: Server-issued stable operation identifier.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        RequestId:
          description: The original request id associated with the operation.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/CancelResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
        Status:
          description: |-
            Status of the operation after the cancel request was applied.

             `Canceling` when the cancelation was accepted for an in-flight operation;
             the terminal status when the operation already finished.
          allOf:
          - $ref: '#/components/schemas/OperationStatus'
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - OperationId
      - RequestId
      - Status
    CancelResponseKind:
      type: string
      pattern: ^CancelResponse$
    CapabilitiesResponse:
      description: Response body for `GET /v1/capabilities`.
      type: object
      properties:
        Managers:
          description: Package-manager-specific capabilities.
          type: array
          items:
            $ref: '#/components/schemas/ManagerCapability'
        MaxRequestBodyBytes:
          description: Maximum accepted request body size, in bytes.
          type: integer
          format: uint64
          minimum: 0
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/CapabilitiesResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
        Transports:
          description: Supported transports.
          type: array
          items:
            $ref: '#/components/schemas/Transport'
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - Transports
      - Managers
      - MaxRequestBodyBytes
    CapabilitiesResponseKind:
      type: string
      pattern: ^CapabilitiesResponse$
    ClientContext:
      description: Context provided by the client.
      type: object
      properties:
        ClientExecutablePath:
          description: File path of the client executable authenticated by the broker.
          type: string
          maxLength: 2048
          minLength: 1
        ClientVersion:
          description: Version of the package broker client binary.
          type: string
          maxLength: 128
          minLength: 1
        EffectiveUser:
          description: Windows identity of the calling user.
          type: string
          maxLength: 256
          minLength: 1
        RequestedElevation:
          description: Elevation level requested.
          allOf:
          - $ref: '#/components/schemas/Elevation'
        Transport:
          description: Transport used by the client to access the broker.
          allOf:
          - $ref: '#/components/schemas/Transport'
      additionalProperties: false
      required:
      - Transport
      - RequestedElevation
      - EffectiveUser
      - ClientExecutablePath
      - ClientVersion
    CommandString:
      description: A command string.
      type: string
      maxLength: 2048
      minLength: 1
    CustomParameterString:
      description: A custom parameter string.
      type: string
      maxLength: 512
      minLength: 1
    Decision:
      description: Policy decision.
      type: string
      enum:
      - Allow
      - Deny
    DecisionInfo:
      description: Policy decision information.
      type: object
      properties:
        Decision:
          description: The evaluation decision.
          allOf:
          - $ref: '#/components/schemas/Decision'
        Reason:
          description: Human-readable reason for the decision.
          type: string
          maxLength: 2048
          minLength: 1
        RuleId:
          description: The rule that produced the decision.
          allOf:
          - $ref: '#/components/schemas/RuleId'
      additionalProperties: false
      required:
      - Decision
      - RuleId
      - Reason
    Elevation:
      description: Requested elevation level.
      type: string
      enum:
      - Standard
      - Elevated
    ErrorCode:
      description: Structured machine-readable error code.
      type: string
      enum:
      - BadRequest
      - Unauthorized
      - Forbidden
      - NotFound
      - Conflict
      - PayloadTooLarge
      - UnsupportedMediaType
      - ValidationFailed
      - BrokerPaused
      - InternalError
      - Timeout
      - UnsupportedEndpoint
      - MalformedDraft
      - InvalidPolicy
      - WarningConfirmationRequired
      - Unauthenticated
      - AdministratorRequired
      - UnsafePolicyPath
      - UnsupportedPolicyFormat
      - StalePolicyStoreToken
      - UnsupportedPolicyFilesystem
      - PolicyPersistenceFailed
      - PolicyActivationFailed
    ErrorDetail:
      description: Structured error detail, typically used for validation failures.
      type: object
      properties:
        Code:
          description: Machine-stable detail code.
          type: string
          maxLength: 128
          minLength: 1
          nullable: true
        Message:
          description: Human-readable detail message.
          type: string
          maxLength: 2048
          minLength: 1
        Path:
          description: JSON pointer, header name, or other location for the error.
          type: string
          maxLength: 512
          minLength: 1
          nullable: true
      required:
      - Message
    ErrorResponse:
      allOf:
      - $ref: '#/components/schemas/ErrorResponseFields'
      oneOf:
      - properties:
          Code:
            enum:
            - StalePolicyStoreToken
          Management:
            $ref: '#/components/schemas/PolicyManagementSnapshot'
        required:
        - Management
      - properties:
          Code:
            not:
              enum:
              - StalePolicyStoreToken
    ErrorResponseFields:
      type: object
      properties:
        Code:
          $ref: '#/components/schemas/ErrorCode'
        Details:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
        Management:
          anyOf:
          - $ref: '#/components/schemas/PolicyManagementSnapshot'
          - enum:
            - null
            nullable: true
          default: null
        Message:
          type: string
          maxLength: 2048
          minLength: 1
        ResponseKind:
          $ref: '#/components/schemas/ErrorResponseKind'
        ResponseVersion:
          $ref: '#/components/schemas/ApiVersion'
        Server:
          $ref: '#/components/schemas/ServerContext'
        Validation:
          anyOf:
          - $ref: '#/components/schemas/PolicyValidationResult'
          - enum:
            - null
            nullable: true
          default: null
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - Code
      - Message
    ErrorResponseKind:
      type: string
      pattern: ^ErrorResponse$
    EvaluationResponse:
      description: Canonical response returned by the broker after evaluating a request.
      type: object
      properties:
        CompletedAt:
          description: UTC timestamp when broker completed evaluation (RFC 3339).
          type: string
          format: date-time
        Decision:
          description: Policy decision details.
          allOf:
          - $ref: '#/components/schemas/DecisionInfo'
        Diagnostics:
          description: Optional diagnostics. Command preview is omitted unless explicitly requested.
          anyOf:
          - $ref: '#/components/schemas/OperationDiagnostics'
          - enum:
            - null
            nullable: true
        Policy:
          description: Summary of the policy used.
          allOf:
          - $ref: '#/components/schemas/ResponsePolicyInfo'
        ReceivedAt:
          description: UTC timestamp when broker received the request (RFC 3339).
          type: string
          format: date-time
        Request:
          description: Parsed request summary.
          allOf:
          - $ref: '#/components/schemas/RequestSummary'
        RequestId:
          description: Echoed request id.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/EvaluationResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
        WouldExecute:
          description: Whether the broker would execute a command for this decision.
          type: boolean
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - RequestId
      - ReceivedAt
      - CompletedAt
      - Request
      - Decision
      - WouldExecute
      - Policy
    EvaluationResponseKind:
      type: string
      pattern: ^EvaluationResponse$
    EventChannel:
      description: Descriptor of a per-operation event channel returned in the execution response.
      type: object
      properties:
        Kind:
          description: Transport kind of the channel.
          allOf:
          - $ref: '#/components/schemas/EventChannelKind'
        Path:
          description: |-
            Transport-specific path. For the `LocalPipe` kind this is the pipe
             name/path the client should connect to.
          type: string
          maxLength: 1024
          minLength: 1
      additionalProperties: false
      required:
      - Kind
      - Path
    EventChannelKind:
      description: Transport kind of a per-operation event channel.
      oneOf:
      - description: Local named pipe carrying `NOW_BROKER` event frames.
        type: string
        enum:
        - LocalPipe
    ExecutionResponse:
      description: Response returned after an execute request is evaluated and, when allowed, submitted.
      type: object
      properties:
        CompletedAt:
          description: UTC timestamp when broker completed evaluation/submission (RFC 3339).
          type: string
          format: date-time
        Decision:
          description: Policy decision details.
          allOf:
          - $ref: '#/components/schemas/DecisionInfo'
        Diagnostics:
          description: Optional diagnostics. Command preview is omitted unless explicitly requested.
          anyOf:
          - $ref: '#/components/schemas/OperationDiagnostics'
          - enum:
            - null
            nullable: true
        Operation:
          description: Submitted operation. Omitted when the decision is deny.
          anyOf:
          - $ref: '#/components/schemas/OperationSubmission'
          - enum:
            - null
            nullable: true
        Policy:
          description: Summary of the policy used.
          allOf:
          - $ref: '#/components/schemas/ResponsePolicyInfo'
        ReceivedAt:
          description: UTC timestamp when broker received the request (RFC 3339).
          type: string
          format: date-time
        Request:
          description: Parsed request summary.
          allOf:
          - $ref: '#/components/schemas/RequestSummary'
        RequestId:
          description: Echoed request id.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/ExecutionResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - RequestId
      - ReceivedAt
      - CompletedAt
      - Request
      - Decision
      - Policy
    ExecutionResponseKind:
      type: string
      pattern: ^ExecutionResponse$
    HealthResponse:
      description: Response body for `GET /v1/health`.
      type: object
      properties:
        PolicyId:
          description: Identifier of the active policy (empty when paused).
          type: string
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/HealthResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
        Status:
          description: Whether the broker is ready or paused.
          allOf:
          - $ref: '#/components/schemas/HealthStatus'
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - Status
      - PolicyId
    HealthResponseKind:
      type: string
      pattern: ^HealthResponse$
    HealthStatus:
      description: Broker readiness state.
      oneOf:
      - description: Broker has a valid policy and is serving requests.
        type: string
        enum:
        - Ready
      - description: Broker is paused (policy file missing or corrupted).
        type: string
        enum:
        - Paused
    InvalidPolicyDiagnostics:
      description: Sanitized diagnostics for an invalid configured policy.
      type: object
      properties:
        DiagnosticsVersion:
          $ref: '#/components/schemas/ApiVersion'
        Findings:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFinding'
      additionalProperties: false
      required:
      - DiagnosticsVersion
      - Findings
    ManagerCapability:
      description: Package-manager-specific capability declaration.
      type: object
      properties:
        Architectures:
          description: Architectures supported for this manager.
          type: array
          items:
            $ref: '#/components/schemas/Architecture'
        Manager:
          description: Package manager name.
          allOf:
          - $ref: '#/components/schemas/ManagerName'
        MaxOperationTimeoutSeconds:
          description: Maximum operation runtime before the broker may time out the process.
          type: integer
          format: uint64
          minimum: 0
          nullable: true
        Operations:
          description: Operations supported for this manager.
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        Scopes:
          description: Installation scopes supported for this manager.
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        SupportsCaptureOutput:
          description: Whether operation output capture is supported.
          type: boolean
        SupportsCustomInstallLocation:
          description: Whether a custom install location is supported.
          type: boolean
        SupportsCustomParameters:
          description: Whether arbitrary custom command-line parameters are supported.
          type: boolean
        SupportsDetails:
          description: Whether operation status may include manager-specific JSON details.
          type: boolean
      required:
      - Manager
      - Operations
      - Scopes
      - Architectures
      - SupportsCustomParameters
      - SupportsCustomInstallLocation
      - SupportsCaptureOutput
      - SupportsDetails
    ManagerName:
      description: Supported package manager names.
      type: string
      enum:
      - Winget
      - PowerShell
      - PowerShell7
      - Apt
      - Bun
      - Cargo
      - Chocolatey
      - Dnf
      - Dotnet
      - Flatpak
      - Homebrew
      - Npm
      - Pacman
      - Pip
      - Scoop
      - Snap
      - Vcpkg
    Operation:
      description: Package operation type.
      type: string
      enum:
      - Install
      - Update
      - Uninstall
    OperationDiagnostics:
      description: Optional operation diagnostics.
      type: object
      properties:
        CommandPreview:
          description: Command that would be executed. Only present when requested by the client.
          type: array
          items:
            $ref: '#/components/schemas/CommandString'
          maxItems: 256
      additionalProperties: false
    OperationStatus:
      description: Status of an asynchronous package operation.
      oneOf:
      - description: Process is being prepared/started.
        type: string
        enum:
        - Starting
      - description: Process is running.
        type: string
        enum:
        - Running
      - description: Cancelation was requested; the process is being terminated.
        type: string
        enum:
        - Canceling
      - description: Process exited successfully (exit code 0).
        type: string
        enum:
        - Completed
      - description: Process failed (non-zero exit, timeout, or launch failure).
        type: string
        enum:
        - Failed
      - description: Operation was canceled at the client's request.
        type: string
        enum:
        - Canceled
    OperationSubmission:
      description: Execution submission returned for allowed execute requests.
      type: object
      properties:
        EventChannel:
          description: |-
            Per-operation event channel carrying `NOW_BROKER` event frames (status
             change notifications and, when the execute request opted in via
             `CaptureOutput`, stdout/stderr data). Present whenever the broker
             supports event channels; absent otherwise.
          anyOf:
          - $ref: '#/components/schemas/EventChannel'
          - enum:
            - null
            nullable: true
        OperationId:
          description: Server-issued stable operation identifier.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        Status:
          description: Initial operation status.
          allOf:
          - $ref: '#/components/schemas/OperationStatus'
        SubmittedAt:
          description: UTC timestamp when the operation was accepted.
          type: string
          format: date-time
      additionalProperties: false
      required:
      - OperationId
      - Status
      - SubmittedAt
    PackageIdentifier:
      description: |-
        Package identifier string.

         Validated against an explicit allowlist of characters: ASCII alphanumerics
         plus `. - _ + @ / : [ ] , # $ % { }`.

         - `.`, `-`, `_`, `+`: winget (`Notepad++.Notepad++`), chocolatey, pip, cargo,
           dotnet, apt/dnf/pacman (`g++`, `libstdc++6`), PowerShell modules;

         - `@`, `/`: scoped npm/Bun packages (`@scope/package`), homebrew and scoop
           `tap/formula` paths, versioned formulas (`python@3.11`);

         - `:`: npm aliases (`alias:@scope/package@1.0.0`), vcpkg triplets
           (`curl:x64-windows`);

         - `[`, `]`, `,`: vcpkg features (`curl[ssl,http2]:x64-windows`), pip extras
           (`requests[socks]`);

         - `#`, `$`, `%`, `{`, `}`: additional identifier punctuation (accepted by
           product decision for forward compatibility). Caveat: these characters
           carry expansion semantics in some shells (`${VAR}`, `%VAR%`, brace
           expansion), so downstream command builders must pass identifiers as
           discrete process arguments and never interpolate them into a shell
           command line.

         Version range/pin operators (`<`, `>`, `=`, `!`, `|`, `^`, `~`) are
         rejected: the broker matches against a specific, exact version carried in
         the request's separate `Package.Version` field, so range expressions do
         not belong in the identifier (npm aliases must use exact versions, e.g.
         `alias:pkg@7.20.0`). The wildcards `*` and `?` are also rejected:
         policy-side package identifier matching is wildcard-based, so wildcards in
         request identifiers would be ambiguous. Everything else — whitespace,
         control characters, `"`, `\`, backtick, `& ' ( ) ;`, and non-ASCII — is
         rejected as well.
      type: string
      maxLength: 256
      minLength: 1
      pattern: ^[A-Za-z0-9._+@/:\[\],#$%{}-]+$
    PackageRequest:
      description: Canonical request sent by a package broker client to the elevated broker.
      type: object
      properties:
        CaptureOutput:
          description: |-
            When true, the operation's stdout/stderr data is pushed over the
             per-operation event channel (see the `EventChannel` descriptor in the
             execution response). The channel itself is opened unconditionally when
             supported and always carries status change notifications; this flag only
             controls whether output data frames are sent. Off by default to avoid the
             overhead when the client does not need the output.
          type: boolean
          default: false
        Client:
          description: Client context.
          allOf:
          - $ref: '#/components/schemas/ClientContext'
        CreatedAt:
          description: UTC timestamp when the client created the request (RFC 3339).
          type: string
          format: date-time
        IncludeCommandPreview:
          description: |-
            When true, evaluation and execution responses may include a command preview for diagnostics.
             Off by default because command previews can expose paths or arguments.
          type: boolean
          default: false
        Manager:
          description: Package manager type.
          allOf:
          - $ref: '#/components/schemas/ManagerName'
        Operation:
          description: The package operation to perform.
          allOf:
          - $ref: '#/components/schemas/Operation'
        Options:
          description: Operation options.
          allOf:
          - $ref: '#/components/schemas/RequestOptions'
        Package:
          description: Package information.
          allOf:
          - $ref: '#/components/schemas/RequestPackage'
        RequestId:
          description: |-
            Unique client-generated request id for request/response correlation.

             Execute requests are idempotent by this identifier: retrying the same
             request id must return the existing submission rather than creating a
             second operation.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        RequestKind:
          description: Request discriminator.
          allOf:
          - $ref: '#/components/schemas/PackageRequestKind'
        RequestVersion:
          description: Client-side API version used to construct the request.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Source:
          description: Source/repository information.
          allOf:
          - $ref: '#/components/schemas/RequestSource'
      additionalProperties: false
      required:
      - RequestKind
      - RequestVersion
      - RequestId
      - CreatedAt
      - Operation
      - Manager
      - Source
      - Package
      - Options
      - Client
    PackageRequestKind:
      type: string
      pattern: ^PackageRequest$
    PolicyConfigurationSource:
