openapi: 3.1.0
info:
  title: Devolutions NOW Package Broker API
  description: HTTP API exposed by a Devolutions NOW package broker facade over a Windows named pipe.
  version: '1.0'
paths:
  /v1/health:
    get:
      summary: Health check
      description: Returns broker readiness state.
      responses:
        '200':
          description: Response body for `GET /v1/health`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/capabilities:
    get:
      summary: Get capabilities
      description: Returns transports, managers, and operations supported by the broker.
      responses:
        '200':
          description: Response body for `GET /v1/capabilities`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/policy:
    get:
      summary: Get active policy
      description: Returns the active parsed policy document. A 404 response means no active policy is configured.
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Response body for `GET /v1/policy`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Replace the configured policy
      description: Reparses and revalidates the raw draft inside the write transaction, then atomically commits it only when the expected opaque store token and validation receipt still match. The complete HTTP request body, including the envelope, is limited to 16 MiB (16,777,216 bytes). This operational transport cap is below the schema's theoretical maximum.
      requestBody:
        description: Request body for `PUT /v1/policy`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyReplacementRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyReplacementResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-max-request-body-bytes: 16777216
  /v1/policy/management:
    get:
      summary: Get policy management state
      description: Atomically returns configured policy state and advisory write capability. Capability fields are UX guidance and are rechecked during replacement.
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Response body for `GET /v1/policy/management`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyManagementResponse'
  /v1/policy/validate:
    post:
      summary: Validate a policy draft
      description: Authoritatively validates raw draft JSON without discarding unknown fields. Validation findings are returned with HTTP 200; malformed envelopes use ErrorResponse. The complete HTTP request body, including the envelope, is limited to 16 MiB (16,777,216 bytes). This operational transport cap is below the schema's theoretical maximum.
      requestBody:
        description: Request body for `POST /v1/policy/validate`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyValidationRequest'
        required: true
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Response body for `POST /v1/policy/validate`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyValidationResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-max-request-body-bytes: 16777216
  /v1/package-operations/evaluate:
    post:
      summary: Evaluate package operation
      description: Evaluates a package operation against policy without requiring elevated execution.
      requestBody:
        description: Canonical request sent by a package broker client to the elevated broker.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRequest'
        required: true
      responses:
        '200':
          description: Canonical response returned by the broker after evaluating a request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/package-operations/execute:
    post:
      summary: Execute package operation
      description: Evaluates a package operation and submits it to the implementation for execution when allowed.
      requestBody:
        description: Canonical request sent by a package broker client to the elevated broker.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRequest'
        required: true
      responses:
        '200':
          description: Response returned after an execute request is evaluated and, when allowed, submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/package-operations/get-status:
    post:
      summary: Query package operation status
      description: Returns the current status of a previously submitted package operation.
      requestBody:
        description: Request body for querying an operation status.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
        required: true
      responses:
        '200':
          description: Response to a status query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/package-operations/cancel:
    post:
      summary: Cancel package operation
      description: 'Requests cancelation of a previously submitted package operation. Cancelation is asynchronous: poll the status endpoint until the operation reaches a terminal status.'
      requestBody:
        description: Request body for canceling a previously submitted operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
        required: true
      responses:
        '200':
          description: |-
            Response to a cancel request.

             Cancelation is asynchronous and idempotent: the broker acknowledges the request by
             moving a non-terminal operation to `Canceling` and reports the resulting status.
             Clients should poll the status endpoint until the operation reaches a terminal
             status (`Canceled`, or `Completed`/`Failed` when the process ends first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ApiVersion:
      description: HTTP API version string.
      type: string
      pattern: ^[0-9]+\.[0-9]+$
    Architecture:
      description: Target architecture.
      type: string
      enum:
      - X86
      - X64
      - Arm64
      - Neutral
    CancelRequest:
      description: Request body for canceling a previously submitted operation.
      type: object
      properties:
        Client:
          description: Client context used to authenticate the cancel request.
          allOf:
          - $ref: '#/components/schemas/ClientContext'
        OperationId:
          description: Server-issued stable operation identifier.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        RequestKind:
          description: Request discriminator.
          allOf:
          - $ref: '#/components/schemas/CancelRequestKind'
        RequestVersion:
          description: Client-side API version used to construct the request.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
      additionalProperties: false
      required:
      - RequestKind
      - RequestVersion
      - OperationId
      - Client
    CancelRequestKind:
      type: string
      pattern: ^CancelRequest$
    CancelResponse:
      description: |-
        Response to a cancel request.

         Cancelation is asynchronous and idempotent: the broker acknowledges the request by
         moving a non-terminal operation to `Canceling` and reports the resulting status.
         Clients should poll the status endpoint until the operation reaches a terminal
         status (`Canceled`, or `Completed`/`Failed` when the process ends first).
      type: object
      properties:
        Message:
          description: Human-readable message about the cancelation outcome.
          type:
          - string
          - 'null'
          maxLength: 2048
        OperationId:
          description: Server-issued stable operation identifier.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        RequestId:
          description: The original request id associated with the operation.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/CancelResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
        Status:
          description: |-
            Status of the operation after the cancel request was applied.

             `Canceling` when the cancelation was accepted for an in-flight operation;
             the terminal status when the operation already finished.
          allOf:
          - $ref: '#/components/schemas/OperationStatus'
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - OperationId
      - RequestId
      - Status
    CancelResponseKind:
      type: string
      pattern: ^CancelResponse$
    CapabilitiesResponse:
      description: Response body for `GET /v1/capabilities`.
      type: object
      properties:
        Managers:
          description: Package-manager-specific capabilities.
          type: array
          items:
            $ref: '#/components/schemas/ManagerCapability'
        MaxRequestBodyBytes:
          description: Maximum accepted request body size, in bytes.
          type: integer
          format: uint64
          minimum: 0
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/CapabilitiesResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
        Transports:
          description: Supported transports.
          type: array
          items:
            $ref: '#/components/schemas/Transport'
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - Transports
      - Managers
      - MaxRequestBodyBytes
    CapabilitiesResponseKind:
      type: string
      pattern: ^CapabilitiesResponse$
    ClientContext:
      description: Context provided by the client.
      type: object
      properties:
        ClientExecutablePath:
          description: File path of the client executable authenticated by the broker.
          type: string
          maxLength: 2048
          minLength: 1
        ClientVersion:
          description: Version of the package broker client binary.
          type: string
          maxLength: 128
          minLength: 1
        EffectiveUser:
          description: Windows identity of the calling user.
          type: string
          maxLength: 256
          minLength: 1
        RequestedElevation:
          description: Elevation level requested.
          allOf:
          - $ref: '#/components/schemas/Elevation'
        Transport:
          description: Transport used by the client to access the broker.
          allOf:
          - $ref: '#/components/schemas/Transport'
      additionalProperties: false
      required:
      - Transport
      - RequestedElevation
      - EffectiveUser
      - ClientExecutablePath
      - ClientVersion
    CommandString:
      description: A command string.
      type: string
      maxLength: 2048
      minLength: 1
    CustomParameterString:
      description: A custom parameter string.
      type: string
      maxLength: 512
      minLength: 1
    Decision:
      description: Policy decision.
      type: string
      enum:
      - Allow
      - Deny
    DecisionInfo:
      description: Policy decision information.
      type: object
      properties:
        Decision:
          description: The evaluation decision.
          allOf:
          - $ref: '#/components/schemas/Decision'
        Reason:
          description: Human-readable reason for the decision.
          type: string
          maxLength: 2048
          minLength: 1
        RuleId:
          description: The rule that produced the decision.
          allOf:
          - $ref: '#/components/schemas/RuleId'
      additionalProperties: false
      required:
      - Decision
      - RuleId
      - Reason
    Elevation:
      description: Requested elevation level.
      type: string
      enum:
      - Standard
      - Elevated
    ErrorCode:
      description: Structured machine-readable error code.
      type: string
      enum:
      - BadRequest
      - Unauthorized
      - Forbidden
      - NotFound
      - Conflict
      - PayloadTooLarge
      - UnsupportedMediaType
      - ValidationFailed
      - BrokerPaused
      - InternalError
      - Timeout
      - UnsupportedEndpoint
      - MalformedDraft
      - InvalidPolicy
      - WarningConfirmationRequired
      - Unauthenticated
      - AdministratorRequired
      - UnsafePolicyPath
      - UnsupportedPolicyFormat
      - StalePolicyStoreToken
      - UnsupportedPolicyFilesystem
      - PolicyPersistenceFailed
      - PolicyActivationFailed
    ErrorDetail:
      description: Structured error detail, typically used for validation failures.
      type: object
      properties:
        Code:
          description: Machine-stable detail code.
          type:
          - string
          - 'null'
          maxLength: 128
          minLength: 1
        Message:
          description: Human-readable detail message.
          type: string
          maxLength: 2048
          minLength: 1
        Path:
          description: JSON pointer, header name, or other location for the error.
          type:
          - string
          - 'null'
          maxLength: 512
          minLength: 1
      required:
      - Message
    ErrorResponse:
      allOf:
      - $ref: '#/components/schemas/ErrorResponseFields'
      oneOf:
      - properties:
          Code:
            enum:
            - StalePolicyStoreToken
          Management:
            $ref: '#/components/schemas/PolicyManagementSnapshot'
        required:
        - Management
      - properties:
          Code:
            not:
              enum:
              - StalePolicyStoreToken
    ErrorResponseFields:
      type: object
      properties:
        Code:
          $ref: '#/components/schemas/ErrorCode'
        Details:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
        Management:
          anyOf:
          - $ref: '#/components/schemas/PolicyManagementSnapshot'
          - enum:
            - null
          default: null
        Message:
          type: string
          maxLength: 2048
          minLength: 1
        ResponseKind:
          $ref: '#/components/schemas/ErrorResponseKind'
        ResponseVersion:
          $ref: '#/components/schemas/ApiVersion'
        Server:
          $ref: '#/components/schemas/ServerContext'
        Validation:
          anyOf:
          - $ref: '#/components/schemas/PolicyValidationResult'
          - enum:
            - null
          default: null
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - Code
      - Message
    ErrorResponseKind:
      type: string
      pattern: ^ErrorResponse$
    EvaluationResponse:
      description: Canonical response returned by the broker after evaluating a request.
      type: object
      properties:
        CompletedAt:
          description: UTC timestamp when broker completed evaluation (RFC 3339).
          type: string
          format: date-time
        Decision:
          description: Policy decision details.
          allOf:
          - $ref: '#/components/schemas/DecisionInfo'
        Diagnostics:
          description: Optional diagnostics. Command preview is omitted unless explicitly requested.
          anyOf:
          - $ref: '#/components/schemas/OperationDiagnostics'
          - enum:
            - null
        Policy:
          description: Summary of the policy used.
          allOf:
          - $ref: '#/components/schemas/ResponsePolicyInfo'
        ReceivedAt:
          description: UTC timestamp when broker received the request (RFC 3339).
          type: string
          format: date-time
        Request:
          description: Parsed request summary.
          allOf:
          - $ref: '#/components/schemas/RequestSummary'
        RequestId:
          description: Echoed request id.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/EvaluationResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
        WouldExecute:
          description: Whether the broker would execute a command for this decision.
          type: boolean
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - RequestId
      - ReceivedAt
      - CompletedAt
      - Request
      - Decision
      - WouldExecute
      - Policy
    EvaluationResponseKind:
      type: string
      pattern: ^EvaluationResponse$
    EventChannel:
      description: Descriptor of a per-operation event channel returned in the execution response.
      type: object
      properties:
        Kind:
          description: Transport kind of the channel.
          allOf:
          - $ref: '#/components/schemas/EventChannelKind'
        Path:
          description: |-
            Transport-specific path. For the `LocalPipe` kind this is the pipe
             name/path the client should connect to.
          type: string
          maxLength: 1024
          minLength: 1
      additionalProperties: false
      required:
      - Kind
      - Path
    EventChannelKind:
      description: Transport kind of a per-operation event channel.
      oneOf:
      - description: Local named pipe carrying `NOW_BROKER` event frames.
        type: string
        enum:
        - LocalPipe
    ExecutionResponse:
      description: Response returned after an execute request is evaluated and, when allowed, submitted.
      type: object
      properties:
        CompletedAt:
          description: UTC timestamp when broker completed evaluation/submission (RFC 3339).
          type: string
          format: date-time
        Decision:
          description: Policy decision details.
          allOf:
          - $ref: '#/components/schemas/DecisionInfo'
        Diagnostics:
          description: Optional diagnostics. Command preview is omitted unless explicitly requested.
          anyOf:
          - $ref: '#/components/schemas/OperationDiagnostics'
          - enum:
            - null
        Operation:
          description: Submitted operation. Omitted when the decision is deny.
          anyOf:
          - $ref: '#/components/schemas/OperationSubmission'
          - enum:
            - null
        Policy:
          description: Summary of the policy used.
          allOf:
          - $ref: '#/components/schemas/ResponsePolicyInfo'
        ReceivedAt:
          description: UTC timestamp when broker received the request (RFC 3339).
          type: string
          format: date-time
        Request:
          description: Parsed request summary.
          allOf:
          - $ref: '#/components/schemas/RequestSummary'
        RequestId:
          description: Echoed request id.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/ExecutionResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - RequestId
      - ReceivedAt
      - CompletedAt
      - Request
      - Decision
      - Policy
    ExecutionResponseKind:
      type: string
      pattern: ^ExecutionResponse$
    HealthResponse:
      description: Response body for `GET /v1/health`.
      type: object
      properties:
        PolicyId:
          description: Identifier of the active policy (empty when paused).
          type: string
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/HealthResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
        Status:
          description: Whether the broker is ready or paused.
          allOf:
          - $ref: '#/components/schemas/HealthStatus'
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - Status
      - PolicyId
    HealthResponseKind:
      type: string
      pattern: ^HealthResponse$
    HealthStatus:
      description: Broker readiness state.
      oneOf:
      - description: Broker has a valid policy and is serving requests.
        type: string
        enum:
        - Ready
      - description: Broker is paused (policy file missing or corrupted).
        type: string
        enum:
        - Paused
    InvalidPolicyDiagnostics:
      description: Sanitized diagnostics for an invalid configured policy.
      type: object
      properties:
        DiagnosticsVersion:
          $ref: '#/components/schemas/ApiVersion'
        Findings:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFinding'
      additionalProperties: false
      required:
      - DiagnosticsVersion
      - Findings
    ManagerCapability:
      description: Package-manager-specific capability declaration.
      type: object
      properties:
        Architectures:
          description: Architectures supported for this manager.
          type: array
          items:
            $ref: '#/components/schemas/Architecture'
        Manager:
          description: Package manager name.
          allOf:
          - $ref: '#/components/schemas/ManagerName'
        MaxOperationTimeoutSeconds:
          description: Maximum operation runtime before the broker may time out the process.
          type:
          - integer
          - 'null'
          format: uint64
          minimum: 0
        Operations:
          description: Operations supported for this manager.
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        Scopes:
          description: Installation scopes supported for this manager.
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        SupportsCaptureOutput:
          description: Whether operation output capture is supported.
          type: boolean
        SupportsCustomInstallLocation:
          description: Whether a custom install location is supported.
          type: boolean
        SupportsCustomParameters:
          description: Whether arbitrary custom command-line parameters are supported.
          type: boolean
        SupportsDetails:
          description: Whether operation status may include manager-specific JSON details.
          type: boolean
      required:
      - Manager
      - Operations
      - Scopes
      - Architectures
      - SupportsCustomParameters
      - SupportsCustomInstallLocation
      - SupportsCaptureOutput
      - SupportsDetails
    ManagerName:
      description: Supported package manager names.
      type: string
      enum:
      - Winget
      - PowerShell
      - PowerShell7
      - Apt
      - Bun
      - Cargo
      - Chocolatey
      - Dnf
      - Dotnet
      - Flatpak
      - Homebrew
      - Npm
      - Pacman
      - Pip
      - Scoop
      - Snap
      - Vcpkg
    Operation:
      description: Package operation type.
      type: string
      enum:
      - Install
      - Update
      - Uninstall
    OperationDiagnostics:
      description: Optional operation diagnostics.
      type: object
      properties:
        CommandPreview:
          description: Command that would be executed. Only present when requested by the client.
          type: array
          items:
            $ref: '#/components/schemas/CommandString'
          maxItems: 256
      additionalProperties: false
    OperationStatus:
      description: Status of an asynchronous package operation.
      oneOf:
      - description: Process is being prepared/started.
        type: string
        enum:
        - Starting
      - description: Process is running.
        type: string
        enum:
        - Running
      - description: Cancelation was requested; the process is being terminated.
        type: string
        enum:
        - Canceling
      - description: Process exited successfully (exit code 0).
        type: string
        enum:
        - Completed
      - description: Process failed (non-zero exit, timeout, or launch failure).
        type: string
        enum:
        - Failed
      - description: Operation was canceled at the client's request.
        type: string
        enum:
        - Canceled
    OperationSubmission:
      description: Execution submission returned for allowed execute requests.
      type: object
      properties:
        EventChannel:
          description: |-
            Per-operation event channel carrying `NOW_BROKER` event frames (status
             change notifications and, when the execute request opted in via
             `CaptureOutput`, stdout/stderr data). Present whenever the broker
             supports event channels; absent otherwise.
          anyOf:
          - $ref: '#/components/schemas/EventChannel'
          - enum:
            - null
        OperationId:
          description: Server-issued stable operation identifier.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        Status:
          description: Initial operation status.
          allOf:
          - $ref: '#/components/schemas/OperationStatus'
        SubmittedAt:
          description: UTC timestamp when the operation was accepted.
          type: string
          format: date-time
      additionalProperties: false
      required:
      - OperationId
      - Status
      - SubmittedAt
    PackageIdentifier:
      description: |-
        Package identifier string.

         Validated against an explicit allowlist of characters used by supported
         package managers. Wildcards and version range operators are rejected.
      type: string
      maxLength: 256
      minLength: 1
      pattern: ^[A-Za-z0-9._+@/:\[\],#$%{}-]+$
    PackageRequest:
      description: Canonical request sent by a package broker client to the elevated broker.
      type: object
      properties:
        CaptureOutput:
          description: |-
            When true, the operation's stdout/stderr data is pushed over the
             per-operation event channel (see the `EventChannel` descriptor in the
             execution response). The channel itself is opened unconditionally when
             supported and always carries status change notifications; this flag only
             controls whether output data frames are sent. Off by default to avoid the
             overhead when the client does not need the output.
          type: boolean
          default: false
        Client:
          description: Client context.
          allOf:
          - $ref: '#/components/schemas/ClientContext'
        CreatedAt:
          description: UTC timestamp when the client created the request (RFC 3339).
          type: string
          format: date-time
        IncludeCommandPreview:
          description: |-
            When true, evaluation and execution responses may include a command preview for diagnostics.
             Off by default because command previews can expose paths or arguments.
          type: boolean
          default: false
        Manager:
          description: Package manager type.
          allOf:
          - $ref: '#/components/schemas/ManagerName'
        Operation:
          description: The package operation to perform.
          allOf:
          - $ref: '#/components/schemas/Operation'
        Options:
          description: Operation options.
          allOf:
          - $ref: '#/components/schemas/RequestOptions'
        Package:
          description: Package information.
          allOf:
          - $ref: '#/components/schemas/RequestPackage'
        RequestId:
          description: |-
            Unique client-generated request id for request/response correlation.

             Execute requests are idempotent by this identifier: retrying the same
             request id must return the existing submission rather than creating a
             second operation.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        RequestKind:
          description: Request discriminator.
          allOf:
          - $ref: '#/components/schemas/PackageRequestKind'
        RequestVersion:
          description: Client-side API version used to construct the request.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Source:
          description: Source/repository information.
          allOf:
          - $ref: '#/components/schemas/RequestSource'
      additionalProperties: false
      required:
      - RequestKind
      - RequestVersion
      - RequestId
      - CreatedAt
      - Operation
      - Manager
      - Source
      - Package
      - Options
      - Client
    PackageRequestKind:
      type: string
      pattern: ^PackageRequest$
    PolicyConfigurationSource:
      description: Origin of the resolved policy path.
      type: string
      enum:
      - DefaultPath
      - ConfiguredPath
    PolicyConflictHandling:
      description: Optimistic-conflict behavior for policy replacement.
      oneOf:
      - type: string
        enum:
        - Reject
      - description: Overwrite only the exact newly observed store token carried by this request.
        type: string
        enum:
        - ConfirmOverwrite
    PolicyFinding:
      description: Versioned, structured policy validation finding.
      type: object
      properties:
        Arguments:
          description: Machine-readable message arguments for localization.
          type: object
          additionalProperties: true
        Code:
          $ref: '#/components/schemas/PolicyFindingCode'
        FindingVersion:
          description: Finding shape version.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Message:
          description: Human-readable fallback for clients that do not recognize the code.
          type: string
          maxLength: 2048
          minLength: 1
        Path:
          description: RFC 6901 JSON Pointer into the submitted draft.
          type: string
          maxLength: 2048
        RuleId:
          anyOf:
          - $ref: '#/components/schemas/ResourceId'
          - enum:
            - null
        Severity:
          $ref: '#/components/schemas/PolicyFindingSeverity'
      additionalProperties: false
      required:
      - FindingVersion
      - Severity
      - Code
      - Path
      - Message
    PolicyFindingCode:
      description: Stable policy validation finding code.
      type: string
      enum:
      - SchemaViolation
      - UnknownField
      - MissingRequiredField
      - InvalidFieldType
      - InvalidFieldValue
      - DuplicateRuleId
      - InvalidVersionRange
      - EmptyVersionRange
      - InvalidWildcardPattern
      - ContradictoryConstraints
      - InvalidValidityInterval
      - UnsupportedPolicyFormatVersion
      - AuditModeEnabled
      - DefaultAllow
      - SensitiveOptionAllowed
    PolicyFindingSeverity:
      description: Severity of a policy validation finding.
      type: string
      enum:
      - Error
      - Warning
    PolicyFormatVersion:
      description: |-
        Software-managed policy document format version.

         Readers accept canonical numeric versions in the compatible 1.x line.
         Applications must stamp the current value, `1.0.0`, for new documents and
         must not expose this value as publisher-authored editable metadata.
         Schemas describe the canonical shape; runtime readers additionally bound
         each numeric component to an unsigned 64-bit integer.
      type: string
      maxLength: 128
      pattern: ^1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?![\s\S])
    PolicyManagementResponse:
      description: Response body for `GET /v1/policy/management`.
      type: object
      properties:
        Management:
          $ref: '#/components/schemas/PolicyManagementSnapshot'
        ResponseKind:
          $ref: '#/components/schemas/PolicyManagementResponseKind'
        ResponseVersion:
          $ref: '#/components/schemas/ApiVersion'
        Server:
          $ref: '#/components/schemas/ServerContext'
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - Management
    PolicyManagementResponseKind:
      type: string
      pattern: ^PolicyManagementResponse$
    PolicyManagementSnapshot:
      allOf:
      - $ref: '#/components/schemas/PolicyManagementSnapshotFields'
      - oneOf:
        - properties:
            InvalidDiagnostics:
              enum:
              - null
            Policy:
              $ref: '#/components/schemas/PolicyDocument'
            State:
              enum:
              - Active
          required:
          - Policy
        - properties:
            InvalidDiagnostics:
              enum:
              - null
            Policy:
              enum:
              - null
            State:
              enum:
              - Missing
        - properties:
            InvalidDiagnostics:
              properties:
                Findings:
                  minItems: 1
                  not:
                    items:
                      properties:
                        Severity:
                          enum:
                          - Warning
                      required:
                      - Severity
              allOf:
              - $ref: '#/components/schemas/InvalidPolicyDiagnostics'
            Policy:
              enum:
              - null
            State:
              enum:
              - Invalid
          required:
          - InvalidDiagnostics
      - oneOf:
        - properties:
            ReadOnlyReason:
              enum:
              - null
            WriteCapability:
              enum:
              - Writable
        - properties:
            ReadOnlyReason:
              $ref: '#/components/schemas/PolicyReadOnlyReason'
            WriteCapability:
              enum:
              - ReadOnly
              - Unsupported
          required:
          - ReadOnlyReason
    PolicyManagementSnapshotFields:
      type: object
      properties:
        ConfiguredPath:
          type: string
          maxLength: 32767
          minLength: 1
        ElevationRequired:
          type: boolean
        InvalidDiagnostics:
          anyOf:
          - $ref: '#/components/schemas/InvalidPolicyDiagnostics'
          - enum:
            - null
          default: null
        Policy:
          anyOf:
          - $ref: '#/components/schemas/PolicyDocument'
          - enum:
            - null
          default: null
        ReadOnlyReason:
          anyOf:
          - $ref: '#/components/schemas/PolicyReadOnlyReason'
          - enum:
            - null
          default: null
        Source:
          $ref: '#/components/schemas/PolicyConfigurationSource'
        State:
          $ref: '#/components/schemas/PolicyManagementState'
        StoreToken:
          $ref: '#/components/schemas/PolicyStoreToken'
        WriteCapability:
          $ref: '#/components/schemas/PolicyWriteCapability'
      additionalProperties: false
      required:
      - State
      - ConfiguredPath
      - StoreToken
      - Source
      - WriteCapability
      - ElevationRequired
    PolicyManagementState:
      description: Current configured-policy state.
      type: string
      enum:
      - Active
      - Missing
      - Invalid
    PolicyReadOnlyReason:
      description: Stable reason why the configured policy cannot be written.
      type: string
      enum:
      - ManagementDisabled
      - PathNotConfigured
      - UnsupportedFormat
      - UnsafePath
      - InsufficientPermissions
      - UnsupportedFileSystem
    PolicyReplacementOperation:
      description: Requested identity/revision behavior for a policy replacement.
      oneOf:
      - description: Update the active policy while retaining its identity and incrementing its revision.
        type: string
        enum:
        - Update
      - description: Replace the active policy with an explicitly different identity at revision 1.
        type: string
        enum:
        - ReplaceIdentity
      - description: Create the first policy at revision 1.
        type: string
        enum:
        - Create
      - description: Replace an invalid configured document at revision 1.
        type: string
        enum:
        - Repair
    PolicyReplacementRequest:
      description: Request body for `PUT /v1/policy`.
      type: object
      properties:
        ConflictHandling:
          $ref: '#/components/schemas/PolicyConflictHandling'
        Draft:
          description: Raw draft JSON retained for transaction-time reparsing and revalidation.
        ExpectedStoreToken:
          $ref: '#/components/schemas/PolicyStoreToken'
        Operation:
          $ref: '#/components/schemas/PolicyReplacementOperation'
        RequestKind:
          $ref: '#/components/schemas/PolicyReplacementRequestKind'
        RequestVersion:
          $ref: '#/components/schemas/ApiVersion'
        ValidationReceipt:
          $ref: '#/components/schemas/PolicyValidationReceipt'
        WarningsAcknowledged:
          description: Explicit acknowledgement of every warning bound into the validation receipt.
          type: boolean
      additionalProperties: false
      required:
      - RequestKind
      - RequestVersion
      - ExpectedStoreToken
      - Operation
      - ConflictHandling
      - WarningsAcknowledged
      - Draft
      - ValidationReceipt
    PolicyReplacementRequestKind:
      type: string
      pattern: ^PolicyReplacementRequest$
    PolicyReplacementResponse:
      allOf:
      - $ref: '#/components/schemas/PolicyReplacementResponseFields'
      - properties:
          Management:
            properties:
              State:
                enum:
                - Active
            required:
            - State
          Validation:
            properties:
              IsValid:
                enum:
                - true
            required:
            - IsValid
    PolicyReplacementResponseFields:
      type: object
      properties:
        Management:
          $ref: '#/components/schemas/PolicyManagementSnapshot'
        Policy:
          $ref: '#/components/schemas/PolicyDocument'
        ResponseKind:
          $ref: '#/components/schemas/PolicyReplacementResponseKind'
        ResponseVersion:
          $ref: '#/components/schemas/ApiVersion'
        Server:
          $ref: '#/components/schemas/ServerContext'
        Validation:
          $ref: '#/components/schemas/PolicyValidationResult'
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - Policy
      - Validation
      - Management
    PolicyReplacementResponseKind:
      type: string
      pattern: ^PolicyReplacementResponse$
    PolicyResponse:
      description: Response body for `GET /v1/policy`.
      type: object
      properties:
        Policy:
          description: Active parsed policy document.
          allOf:
          - $ref: '#/components/schemas/PolicyDocument'
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/PolicyResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - Policy
    PolicyResponseKind:
      type: string
      pattern: ^PolicyResponse$
    PolicyStoreToken:
      description: Opaque token identifying the exact state observed in the policy store.
      type: string
      maxLength: 512
      minLength: 1
      pattern: ^[A-Za-z0-9][A-Za-z0-9._~:\-]{0,511}$
    PolicyValidationReceipt:
      description: Opaque receipt bound to a canonical draft, validator version, and exact warning set.
      type: string
      maxLength: 2048
      minLength: 1
      pattern: ^[A-Za-z0-9][A-Za-z0-9._~:\-]{0,2047}$
    PolicyValidationRequest:
      description: Request body for `POST /v1/policy/validate`.
      type: object
      properties:
        Draft:
          description: Raw draft JSON retained without dropping unknown members.
        RequestKind:
          $ref: '#/components/schemas/PolicyValidationRequestKind'
        RequestVersion:
          $ref: '#/components/schemas/ApiVersion'
      additionalProperties: false
      required:
      - RequestKind
      - RequestVersion
      - Draft
    PolicyValidationRequestKind:
      type: string
      pattern: ^PolicyValidationRequest$
    PolicyValidationResponse:
      description: Response body for `POST /v1/policy/validate`.
      type: object
      properties:
        ResponseKind:
          $ref: '#/components/schemas/PolicyValidationResponseKind'
        ResponseVersion:
          $ref: '#/components/schemas/ApiVersion'
        Server:
          $ref: '#/components/schemas/ServerContext'
        Validation:
          $ref: '#/components/schemas/PolicyValidationResult'
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - Validation
    PolicyValidationResponseKind:
      type: string
      pattern: ^PolicyValidationResponse$
    PolicyValidationResult:
      allOf:
      - $ref: '#/components/schemas/PolicyValidationResultFields'
      oneOf:
      - properties:
          CanonicalDraft:
            $ref: '#/components/schemas/PolicyDraftDocument'
          Findings:
            items:
              properties:
                Severity:
                  enum:
                  - Warning
              required:
              - Severity
          IsValid:
            enum:
            - true
          ValidationReceipt:
            $ref: '#/components/schemas/PolicyValidationReceipt'
        required:
        - CanonicalDraft
        - ValidationReceipt
      - properties:
          CanonicalDraft:
            enum:
            - null
          Findings:
            minItems: 1
            not:
              items:
                properties:
                  Severity:
                    enum:
                    - Warning
                required:
                - Severity
          IsValid:
            enum:
            - false
          ValidationReceipt:
            enum:
            - null
    PolicyValidationResultFields:
      type: object
      properties:
        CanonicalDraft:
          anyOf:
          - $ref: '#/components/schemas/PolicyDraftDocument'
          - enum:
            - null
          default: null
        Findings:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFinding'
        IsValid:
          type: boolean
        ResultVersion:
          $ref: '#/components/schemas/ApiVersion'
        ValidationReceipt:
          anyOf:
          - $ref: '#/components/schemas/PolicyValidationReceipt'
          - enum:
            - null
          default: null
        ValidatorVersion:
          type: string
          maxLength: 128
          minLength: 1
      additionalProperties: false
      required:
      - ResultVersion
      - ValidatorVersion
      - IsValid
      - Findings
    PolicyWriteCapability:
      description: Advisory ability to write the configured policy through the management API.
      type: string
      enum:
      - Writable
      - ReadOnly
      - Unsupported
    ProcessName:
      description: A process name string.
      type: string
      maxLength: 128
      minLength: 1
    RequestOptions:
      description: Options controlling the package operation.
      type: object
      properties:
        CustomInstallLocation:
          description: Custom install directory path.
          type:
          - string
          - 'null'
          maxLength: 2048
        CustomParameters:
          description: Additional command-line parameters.
          type: array
          items:
            $ref: '#/components/schemas/CustomParameterString'
          maxItems: 64
        Interactive:
          description: Run interactively (show installer UI).
          type: boolean
        KillBeforeOperation:
          description: Processes to kill before running the operation.
          type: array
          items:
            $ref: '#/components/schemas/ProcessName'
          maxItems: 64
        NoUpgrade:
          description: Whether to skip upgrade if an existing version is detected (for install operations).
          type: boolean
          default: false
        PostOperationCommand:
          description: Command to execute after the package operation.
          type:
          - string
          - 'null'
          maxLength: 2048
        PreOperationCommand:
          description: Command to execute before the package operation.
          type:
          - string
          - 'null'
          maxLength: 2048
        PreRelease:
          description: Allow pre-release versions.
          type: boolean
        Scope:
          description: Installation scope.
          anyOf:
          - $ref: '#/components/schemas/Scope'
          - enum:
            - null
        SkipHashCheck:
          description: Skip package hash verification.
          type: boolean
        UninstallPrevious:
          description: Whether to uninstall previous version before installing update.
          type: boolean
          default: false
      additionalProperties: false
      required:
      - Interactive
      - SkipHashCheck
      - PreRelease
    RequestPackage:
      description: Package information.
      type: object
      properties:
        Architecture:
          description: Target architecture.
          anyOf:
          - $ref: '#/components/schemas/Architecture'
          - enum:
            - null
        Channel:
          description: Release channel.
          type:
          - string
          - 'null'
          maxLength: 16
          minLength: 1
        Id:
          description: Package identifier (e.g., "Publisher.Package" for WinGet).
          allOf:
          - $ref: '#/components/schemas/PackageIdentifier'
        Version:
          description: |-
            Target version (for update/install operations).

             A lenient version string rather than strict SemVer: real package versions
             are frequently not SemVer (e.g. PowerShell modules use 4-part .NET versions
             like `5.6.0.0`, and some winget packages use 2-part or date-based versions).
          anyOf:
          - $ref: '#/components/schemas/VersionString'
          - enum:
            - null
      additionalProperties: false
      required:
      - Id
    RequestSource:
      description: Package source/repository information.
      type: object
      properties:
        Name:
          description: Source name.
          type: string
          maxLength: 128
          minLength: 1
        Url:
          description: Optional source URL.
          type:
          - string
          - 'null'
          maxLength: 2048
      additionalProperties: false
      required:
      - Name
    RequestSummary:
      description: Parsed request summary included in decision responses.
      type: object
      properties:
        Manager:
          description: Manager from the request (null if not parsed).
          anyOf:
          - $ref: '#/components/schemas/ManagerName'
          - enum:
            - null
        Operation:
          description: Operation from the request (null if not parsed).
          anyOf:
          - $ref: '#/components/schemas/Operation'
          - enum:
            - null
        PackageId:
          description: Package identifier from the request (null if not parsed).
          anyOf:
          - $ref: '#/components/schemas/PackageIdentifier'
          - enum:
            - null
        Source:
          description: Source name from the request (null if not parsed).
          type:
          - string
          - 'null'
          maxLength: 256
          minLength: 1
      additionalProperties: false
    ResourceId:
      description: Resource identifier (operation IDs, request IDs).
      type: string
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,127}$
    ResponsePolicyInfo:
      description: Summary of policy used for the decision.
      type: object
      properties:
        Id:
          description: Policy document identifier.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        PolicyFormatVersion:
          description: Software-managed policy document format version.
          allOf:
          - $ref: '#/components/schemas/PolicyFormatVersion'
        Revision:
          description: Policy revision number.
          type: integer
          format: uint32
          maximum: 2147483647
          minimum: 1
      additionalProperties: false
      required:
      - Id
      - Revision
      - PolicyFormatVersion
    RuleId:
      description: Rule ID in responses. Includes sentinel values not valid as policy rule IDs.
      type: string
      maxLength: 128
      pattern: ^(<default>|<validation-failure>|[A-Za-z0-9][A-Za-z0-9._:\-]{0,127})$
    Scope:
      description: Package installation scope.
      type: string
      enum:
      - User
      - Machine
    ServerContext:
      description: Server context included in responses.
      type: object
      properties:
        ServerVersion:
          description: Version of the package broker server binary.
          type: string
          maxLength: 128
          minLength: 1
        Transport:
          description: Transport mechanism.
          allOf:
          - $ref: '#/components/schemas/Transport'
      additionalProperties: false
      required:
      - ServerVersion
      - Transport
    StatusRequest:
      description: Request body for querying an operation status.
      type: object
      properties:
        Client:
          description: Client context used to authenticate the status query.
          allOf:
          - $ref: '#/components/schemas/ClientContext'
        OperationId:
          description: Server-issued stable operation identifier.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        RequestKind:
          description: Request discriminator.
          allOf:
          - $ref: '#/components/schemas/StatusRequestKind'
        RequestVersion:
          description: Client-side API version used to construct the request.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
      additionalProperties: false
      required:
      - RequestKind
      - RequestVersion
      - OperationId
      - Client
    StatusRequestKind:
      type: string
      pattern: ^StatusRequest$
    StatusResponse:
      description: Response to a status query.
      type: object
      properties:
        CompletedAt:
          description: UTC timestamp when the operation completed or failed (null if still running).
          type:
          - string
          - 'null'
          format: date-time
        Details:
          description: Manager-specific structured status details.
        ExitCode:
          description: Process exit code (present when status is `completed`, or `failed` due to non-zero exit).
          type:
          - integer
          - 'null'
          format: int32
        Message:
          description: |-
            Human-readable message about the status. For failures this carries the short error
             summary (e.g. "winget.exe exited with code 0x8A150011", or a process-launch error).
          type:
          - string
          - 'null'
          maxLength: 2048
        OperationId:
          description: Server-issued stable operation identifier.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        RequestId:
          description: The original request id associated with the operation.
          allOf:
          - $ref: '#/components/schemas/ResourceId'
        ResponseKind:
          description: Response discriminator.
          allOf:
          - $ref: '#/components/schemas/StatusResponseKind'
        ResponseVersion:
          description: Server-side API version used to construct the response.
          allOf:
          - $ref: '#/components/schemas/ApiVersion'
        Server:
          description: Server context.
          allOf:
          - $ref: '#/components/schemas/ServerContext'
        StartedAt:
          description: UTC timestamp when the process was actually launched (null if not yet started).
          type:
          - string
          - 'null'
          format: date-time
        Status:
          description: Current status of the operation.
          allOf:
          - $ref: '#/components/schemas/OperationStatus'
      additionalProperties: false
      required:
      - ResponseKind
      - ResponseVersion
      - Server
      - OperationId
      - RequestId
      - Status
    StatusResponseKind:
      type: string
      pattern: ^StatusResponse$
    Transport:
      description: Broker transport type.
      type: string
      enum:
      - HttpNamedPipe
      - HttpLoopbackSimulator
    VersionString:
      description: A short constrained string for version values.
      type: string
      maxLength: 128
      minLength: 1
    PolicyModelArchitecture:
      description: Target architecture.
      type: string
      enum:
      - X86
      - X64
      - Arm64
      - Neutral
    PolicyModelCustomParameterString:
      description: A custom parameter string.
      type: string
      maxLength: 512
      minLength: 1
    PolicyModelDecision:
      description: Policy decision.
      type: string
      enum:
      - Allow
      - Deny
    PolicyModelElevation:
      description: Effective package-operation execution privilege.
      type: string
      enum:
      - Standard
      - Elevated
    PolicyModelHttpUrl:
      description: |-
        HTTP(S) URL string.

         Validated at deserialization time using the `url` crate.
      type: string
      maxLength: 2048
      pattern: ^([Hh][Tt][Tt][Pp][Ss]?)://.+$
    PolicyModelManagerName:
      description: Supported package manager names.
      type: string
      enum:
      - Winget
      - PowerShell
      - PowerShell7
      - Apt
      - Bun
      - Cargo
      - Chocolatey
      - Dnf
      - Dotnet
      - Flatpak
      - Homebrew
      - Npm
      - Pacman
      - Pip
      - Scoop
      - Snap
      - Vcpkg
    PolicyModelOperation:
      description: Package operation type.
      type: string
      enum:
      - Install
      - Update
      - Uninstall
    PolicyModelPackageIdentifier:
      description: |-
        Exact stable package identifier used by requests and exact policy matching.

         Manager-specific punctuation used by real identifiers is accepted, while
         wildcard characters and range/pin operators are rejected.
      type: string
      maxLength: 256
      minLength: 1
      pattern: ^[A-Za-z0-9._+@/:\[\],#$%{}-]+(?![\s\S])
    PolicyModelPackageIdentifierCondition:
      description: Exactly one package-identifier mode. Exact authorizes stable identifiers; Patterns explicitly authorizes every identifier matched by a wildcard pattern.
      oneOf:
      - type: object
        properties:
          Exact:
            type: array
            items:
              $ref: '#/components/schemas/PolicyModelPackageIdentifier'
            maxItems: 1024
            minItems: 1
            uniqueItems: true
        additionalProperties: false
        required:
        - Exact
      - type: object
        properties:
          Patterns:
            type: array
            items:
              $ref: '#/components/schemas/PolicyModelStringPattern'
            maxItems: 1024
            minItems: 1
            uniqueItems: true
        additionalProperties: false
        required:
        - Patterns
    PolicyModelPolicyConstraints:
      description: Additional safety limits applied after an Allow rule matches.
      type: object
      properties:
        AllowCustomInstallLocation:
          description: Allow custom install location.
          type: boolean
        AllowCustomParameters:
          description: Allow custom parameters.
          type: boolean
        AllowInteractive:
          description: Allow interactive mode.
          type: boolean
        AllowKillBeforeOperation:
          description: Allow killing processes before operation.
          type: boolean
        AllowPrePostCommands:
          description: Allow pre/post operation commands.
          type: boolean
        AllowPreRelease:
          description: Allow pre-release versions.
          type: boolean
        AllowSkipHashCheck:
          description: Allow skipping hash verification.
          type: boolean
        AllowUninstallPrevious:
          description: Allow uninstalling previous version before installing update.
          type: boolean
        AllowUpgrade:
          description: |-
            Allow skipping upgrade on install operations if an existing version
             is detected (for install operations).
          type: boolean
        AllowedCustomParameterPatterns:
          description: Glob patterns for allowed custom parameters.
          type: array
          items:
            $ref: '#/components/schemas/PolicyModelCustomParameterString'
          maxItems: 128
        AllowedCustomParameters:
          description: Exact allowed custom parameters.
          type: array
          items:
            $ref: '#/components/schemas/PolicyModelCustomParameterString'
          maxItems: 128
        AllowedInstallLocationPatterns:
          description: Glob patterns for allowed install locations.
          type: array
          items:
            $ref: '#/components/schemas/PolicyModelStringPattern'
          maxItems: 64
        DeniedCustomParameters:
          description: Denied custom parameters (deny takes precedence over allow).
          type: array
          items:
            $ref: '#/components/schemas/PolicyModelCustomParameterString'
          maxItems: 128
      additionalProperties: false
    PolicyDocument:
      description: A policy document governing which package operations are allowed or denied.
      type: object
      properties:
        Enforcement:
          description: Enforcement configuration.
          allOf:
          - $ref: '#/components/schemas/PolicyModelPolicyEnforcement'
        Metadata:
          description: Policy metadata.
          allOf:
          - $ref: '#/components/schemas/PolicyModelPolicyMetadata'
        PolicyFormatVersion:
          description: |-
            Software-managed policy document format version.

             Applications must not expose this field as publisher-authored editable metadata.
          allOf:
          - $ref: '#/components/schemas/PolicyModelPolicyFormatVersion'
        Rules:
          description: Ordered list of policy rules (may be empty; enforcement defaults apply).
          type: array
          items:
            $ref: '#/components/schemas/PolicyModelPolicyRule'
          maxItems: 1024
      additionalProperties: false
      required:
      - PolicyFormatVersion
      - Metadata
      - Enforcement
      - Rules
    PolicyDraftDocument:
      description: An editable policy document without server-managed commit metadata.
      type: object
      properties:
        Enforcement:
          description: Enforcement configuration.
          allOf:
          - $ref: '#/components/schemas/PolicyModelPolicyEnforcement'
        Metadata:
          description: Editable policy metadata.
          allOf:
          - $ref: '#/components/schemas/PolicyModelPolicyDraftMetadata'
        PolicyFormatVersion:
          description: |-
            Software-managed policy document format version.

             Applications must stamp the current value and must not expose this field
             as publisher-authored editable metadata.
          allOf:
          - $ref: '#/components/schemas/PolicyModelPolicyFormatVersion'
        Rules:
          description: Ordered list of policy rules (may be empty; enforcement defaults apply).
          type: array
          items:
            $ref: '#/components/schemas/PolicyModelPolicyRule'
          maxItems: 1024
      additionalProperties: false
      required:
      - PolicyFormatVersion
      - Metadata
      - Enforcement
      - Rules
    PolicyModelPolicyDraftMetadata:
      description: Editable policy metadata without server-managed revision and publication time.
      type: object
      properties:
        Description:
          description: Human-readable description.
          type:
          - string
          - 'null'
          maxLength: 512
        Id:
          description: Unique policy identifier.
          allOf:
          - $ref: '#/components/schemas/PolicyModelResourceId'
        Publisher:
          description: Organization that publishes the policy.
          type: string
          maxLength: 128
          minLength: 1
        SupportUrl:
          description: URL for support or documentation.
          anyOf:
          - $ref: '#/components/schemas/PolicyModelHttpUrl'
          - enum:
            - null
        ValidFrom:
          description: Policy becomes active at this time.
          type:
          - string
          - 'null'
          format: date-time
        ValidUntil:
          description: Policy expires at this time.
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - Id
      - Publisher
    PolicyModelPolicyEnforcement:
      description: |-
        Enforcement configuration.

         Matching rules are evaluated by ascending priority. Deny wins equal-priority
         Allow/Deny ties; remaining equal-priority ties retain document order.
      type: object
      properties:
        AuditMode:
          description: When true, broker logs decisions but does not enforce.
          type:
          - boolean
          - 'null'
        DefaultDecision:
          description: Decision when no rule matches.
          allOf:
          - $ref: '#/components/schemas/PolicyModelDecision'
      additionalProperties: false
      required:
      - DefaultDecision
    PolicyModelPolicyFormatVersion:
      description: |-
        Software-managed policy document format version.

         Readers accept canonical numeric versions in the compatible 1.x line.
         Applications must stamp the current value, `1.0.0`, for new documents and
         must not expose this value as publisher-authored editable metadata.
         Schemas describe the canonical shape; runtime readers additionally bound
         each numeric component to an unsigned 64-bit integer.
      type: string
      maxLength: 128
      pattern: ^1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?![\s\S])
    PolicyModelPolicyMetadata:
      description: Policy metadata.
      type: object
      properties:
        Description:
          description: Human-readable description.
          type:
          - string
          - 'null'
          maxLength: 512
        Id:
          description: Unique policy identifier.
          allOf:
          - $ref: '#/components/schemas/PolicyModelResourceId'
        PublishedAt:
          description: ISO 8601 publication timestamp (RFC 3339).
          type: string
          format: date-time
        Publisher:
          description: Organization that published the policy.
          type: string
          maxLength: 128
          minLength: 1
        Revision:
          description: Monotonically increasing revision number.
          type: integer
          format: uint32
          maximum: 2147483647
          minimum: 1
        SupportUrl:
          description: URL for support or documentation.
          anyOf:
          - $ref: '#/components/schemas/PolicyModelHttpUrl'
          - enum:
            - null
        ValidFrom:
          description: Policy becomes active at this time.
          type:
          - string
          - 'null'
          format: date-time
        ValidUntil:
          description: Policy expires at this time.
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - Id
      - Publisher
      - Revision
      - PublishedAt
    PolicyModelPolicyRule:
      description: A single policy rule.
      type: object
      properties:
        Constraints:
          description: |-
            Additional safety limits applied after an Allow rule matches.
             Constraints are invalid on Deny rules.
          anyOf:
          - $ref: '#/components/schemas/PolicyModelPolicyConstraints'
          - enum:
            - null
        Decision:
          description: Decision if this rule matches.
          allOf:
          - $ref: '#/components/schemas/PolicyModelDecision'
        Enabled:
          description: Whether the rule is active.
          type: boolean
          default: true
        Id:
          description: Unique rule identifier.
          allOf:
          - $ref: '#/components/schemas/PolicyModelResourceId'
        Match:
          description: |-
            Match criteria — request must satisfy all specified fields.
             At least one effective non-null, nonempty criterion must be present.
          type: object
          properties:
            Architectures:
              description: |-
                Optional architecture filter. Omitted or empty does not narrow matching;
                 canonical serialization omits an empty collection.
              type: array
              items:
                $ref: '#/components/schemas/PolicyModelArchitecture'
              maxItems: 5
              uniqueItems: true
            ExecutionElevation:
              description: |-
                Optional effective execution-elevation filter. Elevated means the package operation
                 will run with administrator privileges; Standard means it will not. Omitted or empty
                 does not narrow matching; canonical serialization omits an empty collection.
              type: array
              items:
                $ref: '#/components/schemas/PolicyModelElevation'
              maxItems: 2
              uniqueItems: true
            HasCustomInstallLocation:
              description: |-
                Optional condition on whether the request has a custom install location.
                 Absent means this characteristic does not affect matching.
              type:
              - boolean
              - 'null'
            HasCustomParameters:
              description: |-
                Optional condition on whether the request has custom parameters.
                 Absent means this characteristic does not affect matching.
              type:
              - boolean
              - 'null'
            HasKillBeforeOperation:
              description: |-
                Optional condition on whether the request has kill-before-operation entries.
                 Absent means this characteristic does not affect matching.
              type:
              - boolean
              - 'null'
            HasPrePostCommands:
              description: |-
                Optional condition on whether the request has pre/post commands.
                 Absent means this characteristic does not affect matching.
              type:
              - boolean
              - 'null'
            HasUninstallPrevious:
              description: |-
                Optional condition on whether the request enables uninstall-previous.
                 Absent means this characteristic does not affect matching.
              type:
              - boolean
              - 'null'
            Interactive:
              description: |-
                Optional condition on the request's interactive characteristic.
                 Absent means this characteristic does not affect matching.
              type:
              - boolean
              - 'null'
            Managers:
              description: |-
                Optional manager filter. Omitted or empty does not narrow matching;
                 canonical serialization omits an empty collection.
              type: array
              items:
                $ref: '#/components/schemas/PolicyModelManagerName'
              maxItems: 16
              uniqueItems: true
            Operations:
              description: |-
                Optional operation filter. Omitted or empty does not narrow matching;
                 canonical serialization omits an empty collection.
              type: array
              items:
                $ref: '#/components/schemas/PolicyModelOperation'
              maxItems: 3
              uniqueItems: true
            PackageIdentifiers:
              description: |-
                Optional package-identifier condition. Exact uses validated stable identifiers; Patterns
                 uses explicit wildcard patterns that may authorize multiple packages. Absent does not
                 narrow matching.
              anyOf:
              - $ref: '#/components/schemas/PolicyModelPackageIdentifierCondition'
              - enum:
                - null
            PreRelease:
              description: |-
                Optional condition on the request's preRelease characteristic.
                 Absent means this characteristic does not affect matching.
              type:
              - boolean
              - 'null'
            Scopes:
              description: |-
                Optional scope filter. Omitted or empty does not narrow matching;
                 canonical serialization omits an empty collection.
              type: array
              items:
                $ref: '#/components/schemas/PolicyModelScope'
              maxItems: 2
              uniqueItems: true
            SkipHashCheck:
              description: |-
                Optional condition on the request's skipHashCheck characteristic.
                 Absent means this characteristic does not affect matching.
              type:
              - boolean
              - 'null'
            SourceNames:
              description: |-
                Optional exact configured-source-name filter. Matching uses the selected package manager's
                 source-name comparison semantics; wildcard characters are literal. Nonempty source names
                 require exactly one manager. Omitted or empty does not narrow matching; canonical
                 serialization omits an empty collection.
              type: array
              items:
                $ref: '#/components/schemas/PolicyModelSourceName'
              maxItems: 128
              uniqueItems: true
            Version:
              description: |-
                Optional package-version condition. Exact supports arbitrary package version strings;
                 Range applies only to semantic versions. Absent does not narrow matching.
              anyOf:
              - $ref: '#/components/schemas/PolicyModelVersionCondition'
              - enum:
                - null
          additionalProperties: false
          anyOf:
          - properties:
              Operations:
                minItems: 1
            required:
            - Operations
          - properties:
              Managers:
                minItems: 1
            required:
            - Managers
          - properties:
              SourceNames:
                minItems: 1
            required:
            - SourceNames
          - properties:
              PackageIdentifiers:
                type: object
            required:
            - PackageIdentifiers
          - properties:
              Version:
                type: object
            required:
            - Version
          - properties:
              Scopes:
                minItems: 1
            required:
            - Scopes
          - properties:
              Architectures:
                minItems: 1
            required:
            - Architectures
          - properties:
              ExecutionElevation:
                minItems: 1
            required:
            - ExecutionElevation
          - properties:
              Interactive:
                type: boolean
            required:
            - Interactive
          - properties:
              SkipHashCheck:
                type: boolean
            required:
            - SkipHashCheck
          - properties:
              PreRelease:
                type: boolean
            required:
            - PreRelease
          - properties:
              HasCustomParameters:
                type: boolean
            required:
            - HasCustomParameters
          - properties:
              HasCustomInstallLocation:
                type: boolean
            required:
            - HasCustomInstallLocation
          - properties:
              HasPrePostCommands:
                type: boolean
            required:
            - HasPrePostCommands
          - properties:
              HasKillBeforeOperation:
                type: boolean
            required:
            - HasKillBeforeOperation
          - properties:
              HasUninstallPrevious:
                type: boolean
            required:
            - HasUninstallPrevious
          if:
            properties:
              SourceNames:
                minItems: 1
            required:
            - SourceNames
          minProperties: 1
          then:
            properties:
              Managers:
                maxItems: 1
                minItems: 1
            required:
            - Managers
        Priority:
          description: Priority (lower = higher precedence).
          type: integer
          format: uint32
          maximum: 2147483647
          minimum: 0
        Reason:
          description: Reason reported to the client.
          type:
          - string
          - 'null'
          maxLength: 512
      additionalProperties: false
      not:
        properties:
          Constraints:
            type: object
          Decision:
            enum:
            - Deny
        required:
        - Decision
        - Constraints
      required:
      - Id
      - Priority
      - Decision
      - Match
    PolicyModelResourceId:
      description: Resource identifier (policy IDs, rule IDs, request IDs, audit IDs).
      type: string
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,127}$
    PolicyModelScope:
      description: Package installation scope.
      type: string
      enum:
      - User
      - Machine
    PolicyModelSemanticVersion:
      description: |-
        Semantic version string (SemVer 2.0.0).

         Validated at deserialization time using the `semver` crate.
      type: string
      maxLength: 128
      pattern: ^(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-4]|18446744073709551615)\.(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-4]|18446744073709551615)\.(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-4]|18446744073709551615)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?![\s\S])
    PolicyModelSourceName:
      description: |-
        Exact configured package source name.

         Matching uses the selected package manager's source-name comparison semantics.
         Wildcard characters have no special meaning and are treated literally.
      type: string
      maxLength: 128
      minLength: 1
    PolicyModelStringPattern:
      description: Case-insensitive exact value or wildcard pattern.
      type: string
      maxLength: 256
      minLength: 1
    PolicyModelVersionCondition:
      description: Exactly one package-version mode. Exact accepts arbitrary package version strings; Range applies only to semantic versions.
      oneOf:
      - type: object
        properties:
          Exact:
            type: array
            items:
              $ref: '#/components/schemas/PolicyModelVersionString'
            maxItems: 256
            minItems: 1
            uniqueItems: true
        additionalProperties: false
        required:
        - Exact
      - type: object
        properties:
          Range:
            $ref: '#/components/schemas/PolicyModelVersionRange'
        additionalProperties: false
        required:
        - Range
    PolicyModelVersionRange:
      description: Nonempty semantic-version range for matching.
      type: object
      properties:
        IncludePrerelease:
          description: Whether to include pre-release versions.
          type: boolean
          default: false
        MaxVersion:
          description: Maximum version (inclusive).
          anyOf:
          - $ref: '#/components/schemas/PolicyModelSemanticVersion'
          - enum:
            - null
        MinVersion:
          description: Minimum version (inclusive).
          anyOf:
          - $ref: '#/components/schemas/PolicyModelSemanticVersion'
          - enum:
            - null
      additionalProperties: false
      anyOf:
      - properties:
          MinVersion:
            type: string
        required:
        - MinVersion
      - properties:
          MaxVersion:
            type: string
        required:
        - MaxVersion
    PolicyModelVersionString:
      description: A short constrained string for version values.
      type: string
      maxLength: 128
      minLength: 1
